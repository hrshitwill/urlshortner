services:

  backend:
    build: ./backend
    container_name: url-shortener-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: url-shortener-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: